apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: db-credentials
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
              # postgres wants an empty dir at the mount point, not a
              # volume root containing lost+found - subPath avoids that
              subPath: pgdata
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: signal-desk-ssd
        resources:
          requests:
            storage: 5Gi
