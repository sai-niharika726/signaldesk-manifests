# Replace these placeholder values before applying to a real cluster.
# For anything beyond local practice, don't commit real secret values to
# git - generate this with `kubectl create secret` or a sealed-secrets /
# external-secrets setup instead.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me-strong-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secret
type: Opaque
stringData:
  FRONTEND_SECRET_KEY: "change-me-flask-secret-key"
