apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
data:
  POSTGRES_USER: "signal"
  POSTGRES_DB: "signaldesk"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  POSTGRES_USER: "signal"
  POSTGRES_DB: "signaldesk"
  # "db" here matches the headless Service name for the StatefulSet -
  # this is the one line that changes vs. Compose's service DNS.
  POSTGRES_HOST: "db"
  POSTGRES_PORT: "5432"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  # "backend" matches the backend Service name below.
  BACKEND_URL: "http://backend:5000"
