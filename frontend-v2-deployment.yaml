# Replace the image with your own registry/tag after building & pushing:
#   docker build -t <registry>/signal-desk-frontend:latest ./frontend
#   docker push <registry>/signal-desk-frontend:latest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      version: canary
  template:
    metadata:
      labels:
        app: frontend
        version: canary
    spec:
      containers:
        - name: frontend
          image: bsainiharika/signal-desk:frontend-v2
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: frontend-config
            - secretRef:
                name: frontend-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
